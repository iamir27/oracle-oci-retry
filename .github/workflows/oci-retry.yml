name: OCI A1.Flex Retry

on:
  schedule:
    - cron: '*/5 * * * *'   # every 5 minutes - the fastest cron allows
  workflow_dispatch: {}       # lets you trigger a manual run from the Actions tab

jobs:
  try-launch:
    runs-on: ubuntu-latest
    steps:
      - name: Install OCI CLI
        run: pip install oci-cli

      - name: Configure OCI CLI from secrets
        run: |
          mkdir -p ~/.oci
          cat > ~/.oci/config << EOF
          [DEFAULT]
          user=${{ secrets.OCI_USER_OCID }}
          fingerprint=${{ secrets.OCI_FINGERPRINT }}
          tenancy=${{ secrets.OCI_TENANCY_OCID }}
          region=${{ secrets.OCI_REGION }}
          key_file=~/.oci/key.pem
          EOF
          echo "${{ secrets.OCI_PRIVATE_KEY }}" > ~/.oci/key.pem
          chmod 600 ~/.oci/key.pem ~/.oci/config

      - name: Skip if instance already exists
        id: check
        run: |
          EXISTING=$(oci compute instance list \
            --compartment-id "${{ secrets.OCI_COMPARTMENT_ID }}" \
            --display-name "autoelever-server" \
            --lifecycle-state "RUNNING" \
            --query "data[0].id" --raw-output 2>/dev/null || echo "")
          if [ -n "$EXISTING" ] && [ "$EXISTING" != "null" ]; then
            echo "already_exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "already_exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Attempt launch
        if: steps.check.outputs.already_exists == 'false'
        run: |
          echo "${{ secrets.SSH_PUBLIC_KEY }}" > ~/ssh_key.pub
          echo '{"ocpus": 2, "memoryInGBs": 12}' > ~/shape_config.json

          AD=$(oci iam availability-domain list \
            --compartment-id "${{ secrets.OCI_COMPARTMENT_ID }}" \
            --query "data[0].name" --raw-output)

          set +e
          OUTPUT=$(oci compute instance launch \
            --compartment-id "${{ secrets.OCI_COMPARTMENT_ID }}" \
            --availability-domain "$AD" \
            --shape "VM.Standard.A1.Flex" \
            --shape-config file://~/shape_config.json \
            --image-id "${{ secrets.OCI_IMAGE_ID }}" \
            --boot-volume-size-in-gbs 100 \
            --subnet-id "${{ secrets.OCI_SUBNET_ID }}" \
            --ssh-authorized-keys-file ~/ssh_key.pub \
            --display-name "autoelever-server" \
            --assign-public-ip true \
            --wait-for-state RUNNING 2>&1)
          EXIT_CODE=$?
          set -e

          echo "$OUTPUT"

          if [ $EXIT_CODE -eq 0 ]; then
            curl -s -d "OCI A1.Flex instance is UP - go check the console!" "https://ntfy.sh/${{ secrets.NTFY_TOPIC }}"
          elif echo "$OUTPUT" | grep -qE "NotAuthenticated|InvalidParameter|does not exist|Forbidden|NotAuthorized"; then
            curl -s -d "OCI script hit a config error - check the GitHub Actions log." "https://ntfy.sh/${{ secrets.NTFY_TOPIC }}"
            exit 1
          else
            echo "Out of capacity or transient error, will retry on next scheduled run."
          fi
