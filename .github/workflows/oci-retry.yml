name: OCI A1.Flex Retry

on:
  schedule:
    - cron: '*/5 * * * *'   # every 5 minutes - the fastest cron allows
  workflow_dispatch: {}       # lets you trigger a manual run from the Actions tab

jobs:
  try-launch:
    runs-on: ubuntu-latest
    steps:
      - name: Install OCI CLI
        run: pip install oci-cli

      - name: Configure OCI CLI from secrets
        run: |
          mkdir -p ~/.oci
          cat > ~/.oci/config << EOF
          [DEFAULT]
          user=${{ secrets.OCI_USER_OCID }}
          fingerprint=${{ secrets.OCI_FINGERPRINT }}
          tenancy=${{ secrets.OCI_TENANCY_OCID }}
          region=${{ secrets.OCI_REGION }}
          key_file=~/.oci/key.pem
          EOF
          echo "${{ secrets.OCI_PRIVATE_KEY }}" > ~/.oci/key.pem
          chmod 600 ~/.oci/key.pem ~/.oci/config

      - name: Skip if instance already exists
        id: check
        run: |
          EXISTING=$(oci compute instance list \
            --compartment-id "${{ secrets.OCI_COMPARTMENT_ID }}" \
            --display-name "autoelever-server" \
            --lifecycle-state "RUNNING" \
            --query "data[0].id" --raw-output 2>/dev/null || echo "")
          if [ -n "$EXISTING" ] && [ "$EXISTING" != "null" ]; then
            echo "already_exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "already_exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Attempt launch (Maximized Loop)
        if: steps.check.outputs.already_exists == 'false'
        run: |
          echo "${{ secrets.SSH_PUBLIC_KEY }}" > ~/ssh_key.pub
          echo '{"ocpus": 2, "memoryInGBs": 12}' > ~/shape_config.json

          # Toronto ka exact AD fixed kar diya kyunki yahan ek hi AD hai
          AD="pgyA:CA-TORONTO-1-AD-1"
          END_TIME=$((SECONDS + 240)) 

          echo "Starting optimized capacity grabber for Toronto AD-1..."
          
          while [ $SECONDS -lt $END_TIME ]; do
            echo "Trying to launch in AD: $AD..."
            
            set +e
            OUTPUT=$(oci compute instance launch \
              --compartment-id "${{ secrets.OCI_COMPARTMENT_ID }}" \
              --availability-domain "$AD" \
              --shape "VM.Standard.A1.Flex" \
              --shape-config file://~/shape_config.json \
              --image-id "${{ secrets.OCI_IMAGE_ID }}" \
              --boot-volume-size-in-gbs 190 \
              --subnet-id "${{ secrets.OCI_SUBNET_ID }}" \
              --ssh-authorized-keys-file ~/ssh_key.pub \
              --display-name "hermes-agent" \
              --assign-public-ip true 2>&1)
            EXIT_CODE=$?
            set -e

            if [ $EXIT_CODE -eq 0 ]; then
              echo "SUCCESS! Instance created."
              curl -s -d "Hermes Agent Server is UP in Toronto! 🎉" "https://ntfy.sh{{ secrets.NTFY_TOPIC }}"
              exit 0
            elif echo "$OUTPUT" | grep -qE "NotAuthenticated|InvalidParameter|Forbidden|NotAuthorized"; then
              echo "Config Error: $OUTPUT"
              curl -s -d "OCI Config Error - Check logs." "https://ntfy.sh{{ secrets.NTFY_TOPIC }}"
              exit 1
            else
              echo "Out of capacity in Toronto AD-1, retrying shortly..."
            fi
            
            sleep 20 # Har 20 seconds baad check karega
          done
